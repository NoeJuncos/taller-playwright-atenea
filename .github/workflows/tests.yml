name: CI - clonando app y ejecutando tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Acá empieza: es como una computadora temporal que crea exclusivamente GitHub para estas tareas
jobs:
    test:
        runs-on: ubuntu-latest
        
        # Crea un contenedor Docker con MongoDB
        services:
            mongo:
                image: mongo:6.0
                ports: 
                    - 27017:27017
        # Las variables de entorno que se van a usar en el back y en el front
        env:
            MONGO_URI: ${{ secrets.MONGO_URI }}
            JWT_SECRET: ${{ secrets.JWT_SECRET }}
            PORT: 6007
            VITE_API_BASE: http://localhost:6007/api
    
        steps:
          - name: Checkout repo actual (con el workflow)
            uses: actions/checkout@v3

          -  name: Clonar el repo Athena Redux Bank
             run: |
                git clone https://github.com/NoeJuncos/redux-athena-bank.git app

          -  name: Crear archivo .env para el backend
             run: |
                echo "MONGO_URI=${{ env.MONGO_URI }}" > app/backend/.env
                echo "JWT_SECRET=${{ env.JWT_SECRET }}" >> app/backend/.env
                echo "PORT=${{ env.PORT }}" >> app/backend/.env
                echo "VITE_API_BASE=${{ env.VITE_API_BASE }}" >> app/backend/.env

          -  name: Instalar dependencias del backend
             run: |
                cd app/backend
                npm install

# Con el backend.log 2>&1 & se redirige la salida del backend a un archivo para poder debuguear si algo falla, y el último & hace que
# el comando se ejecute en segundo plano para que no bloquee la ejecución del workflow
          -  name: Iniciar el backend
             run: |
                cd app/backend
                npm run dev > backend.log 2>&1 &
        
# Se instala la herramienta wait-on globalmente
          -  name: Instalar wait-on
             run: npm install -g wait-on

          -  name: Esperar a que el backend esté disponible
             run: wait-on tcp:6007

          -  name: Instalar dependencias del frontend
             run: |
                cd app/frontend
                npm install

          -  name: Levantar el frontend
             run: |
                cd app/frontend
                npm run dev > frontend.log 2>&1 &
             env: 
                VITE_API_BASE: ${{ env.VITE_API_BASE }}

          -  name: Esperar al frontend
             run: wait-on http://localhost:3000

          -  name: Instalar y ejecutar tests
             run: |
                npm install
                npx playwright install --with-deps
                npx playwright test --reporter=html

          -  name: Guardar reportes como artefactos
             if: always()
             uses: actions/upload-artifact@v4
             with:
                name: playwright-report
                path: ./playwright-report

          -  name: Deployar reportes a GitHub Pages
             if: always()
             run: |
                    git config --global user.name "github-actions[bot]"
                    git config --global user.email "github-actions[bot]@users.noreply.github"
                    cd $RUNNER_TEMP
                    git clone --depth 1 --branch=gh-pages https://x-access-token:${{ secrets.GH_PAGES_PAT }}@github.com/${{ github.repository }} gh-pages

                    cd gh-pages
                    # Limpio
                    rm -rf *
                    mkdir -p report-${GITHUB_RUN_NUMBER}
                    cp -r $GITHUB_WORKSPACE/playwright-report/* ./report-${GITHUB_RUN_NUMBER}/
                    git add .
                    git commit -m "Reporte Playwright - Build #${GITHUB_RUN_NUMBER}"
                    git push origin gh-pages
                    
          -  name: Imprimir link en consola
             if: always()
             run: |
                echo "Reporte Playwright disponible en: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/report-${{ github.run_number }}/"